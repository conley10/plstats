name: Update Understat Player Data

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-understat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Update current Premier League player data
        run: |
          python python/import_understat.py --season 2026

      - name: Commit updated player data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/data/understat-players-2026.json

          if git diff --cached --quiet; then
            echo "No player data changes to commit."
          else
            git commit -m "Update Understat player data"
            git push
          fi